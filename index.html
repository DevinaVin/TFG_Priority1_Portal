<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFG Volunteer Portal</title>
<meta name="description" content="Concept prototype of the Thrift for Good volunteer portal — flexible shift booking, QR check-in, hours tracking and approvals.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="demo-banner">Concept prototype · sample data only · not connected to TFG systems <button data-action="reset" class="link">Reset demo data</button></div>
<header class="topbar">
  <div class="brand"><span class="logo">♻</span><div><b>Thrift for Good</b><small>Volunteer Portal</small></div></div>
  <div class="role-switch" role="tablist">
    <button data-action="role" data-role="volunteer">Volunteer</button>
    <button data-action="role" data-role="manager">Staff / Manager</button>
    <button data-action="role" data-role="join">New sign-up</button>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="app"></main>
<div id="modal-root"></div>
<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
